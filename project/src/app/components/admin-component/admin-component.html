<div class="admin-container">

  <!-- Dashboard Header -->
  <div class="dashboard-header">

    <div>
      <h2>Admin Dashboard</h2>
      <p>Manage registered users</p>
    </div>

    <button
      type="button"
      class="btn btn-primary"
      (click)="addButton()">
      + Add User
    </button>

  </div>


  <!-- User List -->
  <div class="user-list">

    <!-- Header -->
    <div class="user-row user-header">
      <span>Username</span>
      <span>Email</span>
      <span>Role</span>
      <span>Actions</span>
    </div>


    <!-- Loading -->
    @if (loading()) {

      <div class="text-center py-5">

        <div
          class="spinner-border text-primary mb-3"
          role="status">
        </div>

        <p class="text-muted mb-0">
          Loading users...
        </p>

      </div>

    }


    <!-- Users -->
    @else {

      <div *ngFor="let user of users(); trackBy: trackById">

        <div class="user-row">

          <!-- Username -->
          <div class="username">

            <div class="user-avatar">
              {{ user.username.charAt(0).toUpperCase() }}
            </div>

            <a [routerLink]="['/admin/user', user._id]">
              <span>{{ user.username }}</span>
            </a>

          </div>


          <!-- Email -->
          <span class="email">
            {{ user.email }}
          </span>


          <!-- Role -->
          <span class="role">
            {{ user.role }}
          </span>


          <!-- Actions -->
          <div class="actions">

            <button
              type="button"
              class="btn btn-sm btn-outline-primary"
              (click)="EditUser(user)">
              Edit
            </button>

            <button
              type="button"
              class="btn btn-sm btn-outline-danger"
              (click)="DeleteUser(user._id)">
              Delete
            </button>

          </div>

        </div>

      </div>

    }

  </div>


  <!-- User Modal -->
  @if (showEditModal()) {

    <app-modal-component
      [mode]="modalMode()"
      [user]="editUser"
      (save)="SubmitUser($event)"
      (close)="closeEditModal()">
    </app-modal-component>

  }

</div>
