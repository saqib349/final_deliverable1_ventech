<div class="modal-backdrop">

  <div class="edit-modal">

    <div class="modal-header">

      @if (mode() === 'add') {
        <h3>Add User</h3>
      } @else {
        <h3>Edit User</h3>
      }

      <button
        type="button"
        class="close-btn"
        (click)="close.emit()">

        ×

      </button>

    </div>


    <form (ngSubmit)="submit()">

      <div class="form-group">

        <label for="username">
          Username
        </label>

        <input
          id="username"
          type="text"
          [(ngModel)]="user().username"
          name="username"
          required />

      </div>


      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          [(ngModel)]="user().email"
          name="email"
          required />

      </div>


      @if (mode() === 'add') {

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            [(ngModel)]="user().password"
            name="password"
            required />

        </div>

      }


      <div class="form-group">

        <label for="role">
          Role
        </label>

        <select
          id="role"
          [(ngModel)]="user().role"
          name="role"
          required>

          <option value="user">
            User
          </option>

          <option value="admin">
            Admin
          </option>

        </select>

      </div>


      <div class="modal-actions">

        <button
          type="button"
          class="btn btn-secondary"
          (click)="close.emit()">

          Cancel

        </button>


        <button
          type="submit"
          class="btn btn-primary">

          @if (mode() === 'add') {
            Add User
          } @else {
            Save Changes
          }

        </button>

      </div>

    </form>

  </div>

</div>
